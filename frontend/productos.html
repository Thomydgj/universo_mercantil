<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <meta name="description" content="Catálogo de productos - Universo Mercantil. Explora nuestras soluciones de empaques industriales, flexibles, termoformados y fundas para cárnicos.">
    <meta name="keywords" content="catálogo productos empaques, empaques industriales, packaging industrial Colombia">
    <link rel="canonical" href="https://www.universomercantilsas.com/productos">
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="icon" href="assets/logo.webp" type="image/webp">
    <link rel="shortcut icon" href="assets/logo.webp" type="image/webp">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.universomercantilsas.com/productos">
    <meta property="og:title" content="Catálogo de Productos - Universo Mercantil">
    <meta property="og:description" content="Descubre nuestro catálogo de empaques industriales: flexibles, termoformados y fundas para cárnicos.">
    <meta property="og:image" content="https://www.universomercantilsas.com/assets/images/banners/escritorio/hero_pc.webp">
    <meta property="og:image" content="https://www.universomercantilsas.com/assets/images/banners/movil/hero_movil.webp">
    <meta property="og:site_name" content="Universo Mercantil">
    <meta property="og:locale" content="es_CO">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.universomercantilsas.com/productos">
    <meta property="twitter:title" content="Catálogo de Productos">
    <meta property="twitter:description" content="Empaques industriales, flexibles, termoformados y más.">
    <meta property="twitter:image" content="https://www.universomercantilsas.com/assets/images/banners/escritorio/hero_pc.webp">
    
    <!-- Schema.org Markup - CollectionPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Catálogo de Productos",
    "url": "https://www.universomercantilsas.com/productos",
      "description": "Catálogo completo de empaques industriales: flexibles, termoformados y fundas para cárnicos",
      "publisher": {
        "@type": "Organization",
        "name": "Universo Mercantil SAS",
        "url": "https://www.universomercantilsas.com"
      }
    }
    </script>
    
    <!-- BreadcrumbList Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Inicio",
          "item": "https://www.universomercantilsas.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Productos",
          "item": "https://www.universomercantilsas.com/productos"
        }
      ]
    }
    </script>
    
    <title>Productos - Universo Mercantil</title>
</head>
<body>

    <header id="header"></header>
    <main id="productos" class="catalogo-page">
        <div id="banner-productos" class="banner"></div>

        <section class="catalogo-intro">
            <p class="catalogo-breadcrumb"><a href="/">Inicio</a> / Catálogo</p>
            <h1>Catálogo de Productos</h1>
            <div class="decorative-line"></div>
            <!-- <p id="catalogo-descripcion" class="catalogo-descripcion">Explora soluciones de empaque industrial por categoría y encuentra la opción ideal para tu operación.</p> -->

            <div class="catalogo-meta">
                <span id="categoria-actual" class="meta-tag">Todas las categorías</span>
                <span id="contador-productos" class="meta-count">0 productos</span>
            </div>

            <nav id="filtro-categorias" class="filtro-categorias" aria-label="Filtrar por categoría"></nav>
        </section>

        <section id="container-productos" class="container-productos">
            <!-- Plantilla oculta -->
            <template id="template-producto">
                <a class="link-producto" href="#">
                    <article class="tarjeta-producto">
                        <figure>
                            <div class="imagen-producto">
                                <img src="" alt="">
                            </div>
                        
                            <div class="detalles-producto">
                                <h3 class="nombre-producto"></h3>
                                <p class="descripcion-corta-producto"></p>
                                <!-- <p class="precio-producto"></p> -->
                            </div>
                        </figure>
                    </article>
                </a>
            </template>

        </section>

        <section class="catalogo-asesoria">
            <div class="catalogo-asesoria-content">
                <h2>¿Necesitas Asesoría para Elegir el Empaque Correcto?</h2>
                <a href="/#cotizacion" class="btn-catalogo-asesoria">Solicitar asesoría</a>
            </div>
        </section>

    </main>
    <footer id="footer"></footer>
    <script src="./scripts/runtime-config.js"></script>
    <script src="./scripts/loadComponents.js"></script>
    <script src="./scripts/productos.js"></script>
    <script src="./scripts/loadProductos.js"></script>
    
</body>
</html>
