<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle de producto - Universo Mercantil. Conoce especificaciones y soluciones de empaque para tu negocio.">
    <title>Detalle de Producto - Universo Mercantil</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="icon" href="assets/logo.webp" type="image/webp">
    <link rel="shortcut icon" href="assets/logo.webp" type="image/webp">
</head>
<body>
    <header id="header"></header>
    <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

    <main id="detalles-producto" class="detalle-page">

        <section class="detalle-intro">
            <p id="detalle-breadcrumb" class="catalogo-breadcrumb"><a href="index.html">Inicio</a> / <a href="productos.html">Productos</a> / Detalle</p>
            <h1 id="detalle-titulo">Detalle del Producto</h1>
            <div class="decorative-line"></div>
        </section>

        <section id="container-detalles-producto" class="container-detalles-producto">
            
            <template id="template-detalle">

                <article class="detalle-producto-card">

                <div class="detalle-media">

                    <div class="carrusel-producto"> 

                        <button class="prev">‹</button>
                        <div class="carrusel-fila">
                            <!-- Las imágenes del carrusel se cargarán aquí dinámicamente -->
                        </div>
                        <button class="next">›</button>

                    </div>

                </div>

                <div class="detalles-texto">
                    <p class="detalle-kicker">Guía de línea</p>
                    <h2 class="nombre-producto"></h2>
                    <div class="detalle-meta">
                        <span class="detalle-categoria"></span>
                        <span class="detalle-linea"></span>
                    </div>
                    <p class="descripcion-larga-producto"></p>

                    <div class="detalle-paneles">
                        <section class="detalle-panel">
                            <h3>Ventajas clave</h3>
                            <ul class="detalle-ventajas-lista"></ul>
                        </section>

                        <section class="detalle-panel">
                            <h3>Usos recomendados</h3>
                            <div class="detalle-usos-lista"></div>
                        </section>
                    </div>

                    <div class="detalle-cta-wrap">
                        <a class="btn-detalle-whatsapp" href="#" target="_blank" rel="noopener noreferrer">Asesoría por WhatsApp</a>
                    </div>

                </div>

                </article>

            </template>

        </section>

        <section class="detalle-catalogo-real" aria-labelledby="catalogo-real-titulo">
            <div class="detalle-catalogo-real-head">
                <h2 id="catalogo-real-titulo">Catálogo comercial</h2>
                <p id="catalogo-real-status" class="catalogo-real-status">Consultando referencias...</p>
            </div>

            <div id="catalogo-real-filtros" class="catalogo-real-filtros" aria-label="Filtros del catálogo comercial"></div>

            <div id="catalogo-real-container" class="catalogo-real-grid"></div>
            <nav id="catalogo-real-pagination" class="catalogo-real-pagination" aria-label="Paginación del catálogo comercial" hidden></nav>

            <template id="template-siigo-item">
                <article class="siigo-item-card">
                    <div class="siigo-item-image" aria-label="Espacio para imagen del producto">Imagen pendiente</div>
                    <div class="siigo-item-content">
                        <h3 class="siigo-item-nombre"></h3>
                        <p class="siigo-item-sku"></p>
                        <p class="siigo-item-precio"></p>
                        <p class="siigo-item-stock"></p>
                        <div class="siigo-item-actions">
                            <label>Cantidad</label>
                            <input type="number" class="siigo-item-cantidad" min="1" value="1">
                            <button type="button" class="siigo-item-agregar">Agregar al carrito</button>
                            <button type="button" class="siigo-item-detalle">Ver detalle</button>
                        </div>
                    </div>
                </article>
            </template>
        </section>

        <div id="catalogo-item-modal" class="catalogo-item-modal" hidden aria-hidden="true">
            <div class="catalogo-item-modal-backdrop" data-close-catalogo-modal></div>
            <article class="catalogo-item-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="catalogo-modal-titulo">
                <button type="button" id="catalogo-modal-close" class="catalogo-modal-close" aria-label="Cerrar detalle">×</button>

                <div class="catalogo-modal-grid">
                    <section class="catalogo-modal-media">
                        <div class="catalogo-modal-main-wrap">
                            <button type="button" id="catalogo-modal-prev" class="catalogo-modal-nav" aria-label="Imagen anterior">‹</button>
                            <div class="catalogo-modal-main">
                                <img id="catalogo-modal-image" src="" alt="Imagen de referencia" hidden>
                                <p id="catalogo-modal-empty" class="catalogo-modal-empty">Imagen pendiente</p>
                            </div>
                            <button type="button" id="catalogo-modal-next" class="catalogo-modal-nav" aria-label="Siguiente imagen">›</button>
                        </div>
                        <div id="catalogo-modal-thumbs" class="catalogo-modal-thumbs" hidden></div>
                    </section>

                    <section class="catalogo-modal-info">
                        <p class="catalogo-modal-kicker">Detalle de referencia</p>
                        <h3 id="catalogo-modal-titulo"></h3>
                        <div id="catalogo-modal-descripcion" class="catalogo-modal-descripcion" hidden></div>
                        <p id="catalogo-modal-sku" class="catalogo-modal-sku"></p>
                        <p id="catalogo-modal-precio" class="catalogo-modal-precio"></p>
                        <p id="catalogo-modal-stock" class="catalogo-modal-stock"></p>

                        <label class="catalogo-modal-cantidad-wrap" for="catalogo-modal-cantidad">
                            Cantidad
                            <input type="number" id="catalogo-modal-cantidad" min="1" value="1">
                        </label>

                        <div class="catalogo-modal-actions">
                            <button type="button" id="catalogo-modal-agregar" class="catalogo-modal-btn agregar">Agregar al carrito</button>
                            <button type="button" id="catalogo-modal-comprar" class="catalogo-modal-btn comprar">Comprar ahora</button>
                        </div>
                    </section>
                </div>
            </article>
        </div>

        <section class="detalle-asesoria">
            <div class="detalle-asesoria-content">
                <h2>¿Necesitas una recomendación personalizada?</h2>
                <!-- <p>Cuéntanos tu tipo de producto y te ayudamos a elegir el empaque ideal según conservación, transporte y presentación final.</p> -->
                <a href="index.html#cotizacion" class="btn-catalogo-asesoria">Solicitar asesoría</a>
            </div>
        </section>
        
    </main>    


    <footer id="footer"></footer>



    <script src="./scripts/runtime-config.js"></script>
    <script src="./scripts/loadComponents.js"></script>
    <script src="./scripts/uiFeedback.js"></script>
    <script src="./scripts/productos.js"></script>
    <script src="./scripts/categorias.js"></script>
    <script src="./scripts/loadDetalles.js"></script>

</body>
</html>
